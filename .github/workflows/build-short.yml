name: Daily science Short
on:
  push:
    branches: [main]
    paths:
      - "make_short.py"
      - "requirements.txt"
      - ".github/workflows/build-short.yml"
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Science topic slug, or auto"
        required: false
        default: "auto"
        type: string
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt piper-tts
      - name: Acquire openly licensed footage
        run: python fetch_footage.py "${{ github.event.inputs.topic || 'auto' }}"
      - name: Render science Short
        env:
          TOPIC: ${{ github.event.inputs.topic || 'auto' }}
        run: python make_short.py --topic "$TOPIC"
      - name: Validate rendered video
        run: python validate_output.py
      - name: Upload video and review files
        uses: actions/upload-artifact@v4
        with:
          name: science-short-${{ github.run_number }}
          path: output/
          if-no-files-found: error
          retention-days: 7
